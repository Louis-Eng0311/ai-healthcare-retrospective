<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&amp;display=swap" rel="stylesheet">
<style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #F8FAFC;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        .slide-container {
            width: 1920px;
            height: 1080px;
            display: flex;
            flex-direction: column;
            position: relative;
            background-color: #F8FAFC;
            color: #334155;
        }
        .content-wrapper {
            padding: 56px 80px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* Typography & Colors */
        .text-primary { color: #2F6BFF; }
        .bg-primary { background-color: #2F6BFF; }
        .text-accent { color: #16C2B2; }
        .bg-accent { background-color: #16C2B2; }

        /* Grid Layout */
        .tech-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 32px;
            height: 100%;
            padding-top: 20px;
            padding-bottom: 40px;
        }

        /* Card Styles */
        .tech-card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            border: 1px solid #E2E8F0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .tech-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px -10px rgba(47, 107, 255, 0.1);
            border-color: #CBD5E1;
        }

        .card-header {
            display: flex;
            align-items: center;
            margin-bottom: 24px;
        }

        .category-badge {
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 6px 12px;
            border-radius: 6px;
            margin-bottom: 16px;
            display: inline-block;
        }

        .tech-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .tech-item {
            display: flex;
            align-items: center;
            font-size: 22px;
            font-weight: 500;
            color: #1E293B;
        }

        .tech-icon {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            font-size: 24px;
            margin-right: 16px;
            flex-shrink: 0;
        }

        /* Specific Card Themes */
        .theme-blue .category-badge { background-color: #EFF6FF; color: #2F6BFF; }
        .theme-blue .tech-icon { background-color: #F1F5F9; color: #2F6BFF; }

        .theme-teal .category-badge { background-color: #F0FDFA; color: #0F766E; }
        .theme-teal .tech-icon { background-color: #F1F5F9; color: #0F766E; }

        .theme-indigo .category-badge { background-color: #EEF2FF; color: #4F46E5; }
        .theme-indigo .tech-icon { background-color: #F1F5F9; color: #4F46E5; }

        .theme-slate .category-badge { background-color: #F1F5F9; color: #475569; }
        .theme-slate .tech-icon { background-color: #F8FAFC; color: #475569; }

        .theme-purple .category-badge { background-color: #FAF5FF; color: #7E22CE; }
        .theme-purple .tech-icon { background-color: #F3E8FF; color: #7E22CE; }

        .bg-pattern {
            position: absolute;
            right: -20px;
            bottom: -20px;
            font-size: 180px;
            opacity: 0.03;
            transform: rotate(-15deg);
            pointer-events: none;
        }

    </style>
</head>
